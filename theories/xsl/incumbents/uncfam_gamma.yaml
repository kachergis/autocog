name: Uncertainty/familiarity associative learning with a familiarity exponent (uncfam_gamma)
theory: 'Kachergis, Yu & Shiffrin (2012) uncfam with familiarity raised to a free power gamma: attention
  to a pair is assoc^gamma * exp(B * H(word)) * exp(B * H(object)). gamma = 1 is uncfam; gamma < 1 dampens
  the rich-get-richer bias.'
learn: "def learn(params, trials, n_words, n_objects):\n    X, B, C, gamma = params[\"X\"], params[\"\
  B\"], params[\"C\"], params[\"gamma\"]\n    start = 0.01\n    m = np.zeros((n_words, n_objects))\n\n\
  \    def entropy(p):\n        q = p[p > 0] / p.sum()\n        return -(q * np.log2(q)).sum()\n\n   \
  \ for words, objects in trials:\n        # seed never-seen pairs on this trial, and pairs between trial\n\
  \        # stimuli and already-familiar stimuli, at a small start value\n        block = m[np.ix_(words,\
  \ objects)]\n        block[block == 0] = start\n        m[np.ix_(words, objects)] = block\n        fam_o\
  \ = m.sum(axis=0) > 0\n        fam_w = m.sum(axis=1) > 0\n        for w in words:\n            m[w,\
  \ fam_o & (m[w, :] == 0)] = start\n        for o in objects:\n            m[fam_w & (m[:, o] == 0),\
  \ o] = start\n\n        assocs = m[np.ix_(words, objects)]\n        h_w = np.array([entropy(m[w, :])\
  \ for w in words])\n        h_o = np.array([entropy(m[:, o]) for o in objects])\n        weights = assocs\
  \ ** gamma * np.outer(np.exp(B * h_w), np.exp(B * h_o))\n        m *= C\n        m[np.ix_(words, objects)]\
  \ += X * weights / weights.sum()\n    return m\n"
parameters:
  X: '[0.001, 5]'
  B: '[0.1, 15]'
  C: '[0.5, 1]'
  gamma: '[0.1, 6]'
rationale: xsl-bakeoff v05 incumbent (XSLmodels uncfam_gamma); v05 bounds.
