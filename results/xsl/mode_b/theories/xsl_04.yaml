name: Interference learning with test-time object-claim competition
theory: 'Learning follows the accepted account. Credit for each pair is the product of the word-side and
  object-side responsibilities, gain saturates, and retrieval-induced interference prunes links to absent
  partners at a rate that grows as a power law of trial load. At test, people also use mutual exclusivity.
  An object already strongly claimed by other words is a poor referent for the word being tested. The
  effective strength of a candidate is therefore its learned association times the share of that object''s
  total association that belongs to the tested word, raised to a fitted power b. A retrieval-noise floor
  is then added. This changes which wrong objects are chosen: wrong choices are drawn to objects that
  no word has claimed, and are less likely to be objects that other words own.'
learn: |
  def learn(params, trials, n_words, n_objects):
      d = params['d']
      q = params['q']
      lam = params['lam']
      Mmax = params['Mmax']
      fl = params['fl']
      b = params['b']
      s = 4.0
      c = 0.5
      g = 0.5
      eps = 0.1
      M = np.zeros((n_words, n_objects))
      for words, objs in trials:
          words = np.asarray(words)
          objs = np.asarray(objs)
          nw = len(words)
          no = len(objs)
          enc = 1.0 / (1.0 + (no / c) ** g)
          deff = min(0.95, d * (nw * no / 12.0) ** q)
          ix = np.ix_(words, objs)
          blk = M[ix].copy()
          M[words, :] *= (1.0 - deff)
          M[:, objs] *= (1.0 - deff)
          st = (blk + eps) ** s
          rw = st / st.sum(1, keepdims=True)
          ro = st / st.sum(0, keepdims=True)
          inc = rw * ro
          sat = np.clip(1.0 - blk / Mmax, 0.0, 1.0)
          M[ix] = blk + lam * enc * inc * sat
      col = M.sum(0, keepdims=True)
      share = (M + 1e-9) / (col + 0.05)
      out = M * share ** b
      return out + fl + 1e-6
parameters:
  d: '[0.0, 1.0]'
  q: '[0.0, 2.0]'
  lam: '[0.05, 4]'
  Mmax: '[0.3, 10]'
  fl: '[0.0, 3.0]'
  b: '[0.0, 3.0]'
  ch_dec: '[0.3, 6]'
rationale: The accepted model treats each test word independently, using only the row of the matrix. Human
  forced-choice responding in n-AFC tests also reflects mutual exclusivity across words, because learners
  avoid objects already assigned to other words. The learner already has object-side competition during
  training, but the test-time read-out ignores it. Weighting each candidate by the tested word's share
  of the object's total association is one extra parameter, and b=0 recovers the current best model. It
  should sharpen accuracy where learning is partial, such as the low-diversity and high-frequency conditions
  that are currently underpredicted (220, 215, 225, freq369), and it should change the pattern of wrong
  choices, which the multinomial likelihood rewards.
