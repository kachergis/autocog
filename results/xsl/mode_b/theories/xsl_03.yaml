name: Load-scaled absent-alternative interference with saturating competitive encoding
theory: Each word splits credit over the co-present objects and each object over the co-present words
  (sharpened strength plus a prior). A pair gains the product of its two responsibilities, which gives
  soft mutual exclusivity and explaining away. The gain saturates as a pair's strength approaches a ceiling,
  and it is mildly gated down when many objects are present. Forgetting is retrieval-induced interference.
  When a word is heard, its links to absent objects decay, and when an object is seen, its links to absent
  words decay. Co-present pairs are protected from this decay. The decay rate grows as a power law in
  trial load, the number of words times the number of objects. Sparse trials (1x3, 2x2) therefore barely
  erode earlier learning, so accuracy is high and snowballs with repetition, while dense trials (3x4,
  4x4) prune strongly. Three, six and nine repetitions give graded rather than all-or-none learning. Test
  choice is a power-law Luce rule.
learn: |-
  def learn(params, trials, n_words, n_objects):
      d = params['d']
      q = params['q']
      lam = params['lam']
      Mmax = params['Mmax']
      s = 4.0
      c = 0.5
      g = 0.5
      eps = 0.1
      M = np.zeros((n_words, n_objects))
      for words, objs in trials:
          words = np.asarray(words)
          objs = np.asarray(objs)
          nw = len(words)
          no = len(objs)
          enc = 1.0 / (1.0 + (no / c) ** g)
          deff = min(0.95, d * (nw * no / 12.0) ** q)
          ix = np.ix_(words, objs)
          blk = M[ix].copy()
          M[words, :] *= (1.0 - deff)
          M[:, objs] *= (1.0 - deff)
          st = (blk + eps) ** s
          rw = st / st.sum(1, keepdims=True)
          ro = st / st.sum(0, keepdims=True)
          inc = rw * ro
          sat = np.clip(1.0 - blk / Mmax, 0.0, 1.0)
          M[ix] = blk + lam * enc * inc * sat
      return M + 1e-6
parameters:
  d: '[0.0, 1.0]'
  q: '[0.0, 2.0]'
  lam: '[0.05, 4]'
  Mmax: '[0.3, 10]'
  ch_dec: '[0.3, 6]'
rationale: This builds on the accepted retrieval-induced-interference model with three changes. First,
  it drops the parameters pinned at their bounds (c, d2) and fixes s. Second, a load-dependent decay lets
  easy designs such as 1x3 and 2x2 retain and accumulate evidence, where the current best underfits them
  badly (0.37 against 0.74), while dense designs still lose spurious associations. Third, a saturating
  gain makes accuracy graded in repetition count, which matches the filt*E_*L conditions where 3, 6 and
  9 late repetitions differ. Fewer free parameters than the current best (6 including lapse, against 7)
  also lowers the BIC penalty.
