name: Consecutive-repetition boosted interference learning
theory: 'Learning is competitive and interference-limited: each pair gains the product of its word-side
  and object-side responsibilities (soft mutual exclusivity and explaining away), the gain saturates,
  and retrieval-induced interference prunes a word''s links to absent objects and an object''s links to
  absent words at a rate that is a power law of trial load (words x objects). In addition, learners hold
  a one-trial working-memory trace of the previous trial''s co-occurrences. A word-object pair that is
  also present on the immediately preceding trial is recognised as a repeat, so it receives amplified
  credit (1 + r). This explains the benefit of temporal contiguity: when consecutive trials share items,
  repeated pairs are boosted before interference erodes them, whereas in randomly ordered designs consecutive
  repeats are rare and the boost is negligible. At test, an object already claimed by other words is a
  poorer referent: association is multiplied by the tested word''s share of that object''s total association,
  raised to a power b, plus a retrieval floor. Choice is a power-law Luce rule.'
learn: |
  def learn(params, trials, n_words, n_objects):
      d = params['d']
      q = params['q']
      lam = params['lam']
      Mmax = params['Mmax']
      fl = params['fl']
      b = params['b']
      r = params['r']
      s = 4.0
      c = 0.5
      g = 0.5
      eps = 0.1
      M = np.zeros((n_words, n_objects))
      prev = np.zeros((n_words, n_objects))
      for words, objs in trials:
          words = np.asarray(words)
          objs = np.asarray(objs)
          nw = len(words)
          no = len(objs)
          enc = 1.0 / (1.0 + (no / c) ** g)
          deff = min(0.95, d * (nw * no / 12.0) ** q)
          ix = np.ix_(words, objs)
          blk = M[ix].copy()
          M[words, :] *= (1.0 - deff)
          M[:, objs] *= (1.0 - deff)
          st = (blk + eps) ** s
          rw = st / st.sum(1, keepdims=True)
          ro = st / st.sum(0, keepdims=True)
          inc = rw * ro
          sat = np.clip(1.0 - blk / Mmax, 0.0, 1.0)
          bonus = 1.0 + r * prev[ix]
          M[ix] = blk + lam * enc * inc * sat * bonus
          prev = np.zeros((n_words, n_objects))
          prev[ix] = 1.0
      col = M.sum(0, keepdims=True)
      share = (M + 1e-9) / (col + 0.05)
      out = M * share ** b
      return out + fl + 1e-6
parameters:
  d: '[0.0, 1.0]'
  q: '[0.0, 2.0]'
  lam: '[0.05, 4]'
  Mmax: '[0.3, 10]'
  fl: '[0.0, 3.0]'
  b: '[0.0, 3.0]'
  r: '[0.0, 30]'
  ch_dec: '[0.3, 6]'
rationale: The previous best candidate's strength-protection parameter K was useless (it fitted to 17.5,
  which turns protection off), so I removed it. The worst-fitted designs include the temporal-contiguity
  conditions (e.g. 1_max_temp_spat_cont_orig at 0.489 human vs 0.329 model, 4_no_spat_orig_max_tc, temp_cont_2olap2tr_contr),
  where the model gives identical accuracy because it is blind to trial order. A one-parameter, order-sensitive
  repeat-detection mechanism targets exactly these conditions and is neutral for random orderings. r=0
  recovers xsl_04, so the fit can only improve beyond the cost of the parameter if contiguity effects
  are real in the data, which they are.
