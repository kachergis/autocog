name: Decaying-trace contiguity interference learning
theory: Learning is competitive and interference-limited. Credit for a pair is the product of word-side
  and object-side responsibilities (power-sharpened shares), and the gain saturates and is gated by the
  number of visible objects. Retrieval-induced interference prunes links to absent partners, with a rate
  set by the number of objects and by words x objects load. The new claim is that the memory of recent
  co-occurrence is a graded, fading trace rather than a one-trial flag. A pair seen on the previous trial
  is strongly marked, one seen two or three trials ago is marked more weakly, and the mark decays geometrically.
  Marked pairs receive amplified credit (1 + r*trace), which is how temporal contiguity helps. This lets
  designs with overlap every 2 or 3 trials differ from designs with immediate repeats, and from random
  orderings. At test, objects claimed by other words are discounted (share^b), a retrieval floor is added,
  and choice is a power-law Luce rule.
learn: |-
  def learn(params, trials, n_words, n_objects):
      d = params['d']
      q = params['q']
      lam = params['lam']
      Mmax = params['Mmax']
      fl = params['fl']
      b = params['b']
      s = params['s']
      r = params['r']
      p = params['p']
      rho = params['rho']
      c = 0.5
      g = 0.5
      eps = 0.1
      M = np.zeros((n_words, n_objects))
      prev = np.zeros((n_words, n_objects))
      for words, objs in trials:
          words = np.asarray(words)
          objs = np.asarray(objs)
          nw = len(words)
          no = len(objs)
          enc = 1.0 / (1.0 + (no / c) ** g)
          deff = min(0.95, d * (nw * no / 12.0) ** q * (no / 4.0) ** p)
          ix = np.ix_(words, objs)
          blk = M[ix].copy()
          boost = 1.0 + r * prev[ix]
          M[words, :] *= (1.0 - deff)
          M[:, objs] *= (1.0 - deff)
          st = (blk + eps) ** s
          rw = st / st.sum(1, keepdims=True)
          ro = st / st.sum(0, keepdims=True)
          inc = rw * ro
          sat = np.clip(1.0 - blk / Mmax, 0.0, 1.0)
          M[ix] = blk + lam * enc * boost * inc * sat
          prev *= rho
          prev[ix] = 1.0
      col = M.sum(0, keepdims=True)
      share = (M + 1e-9) / (col + 0.05)
      out = M * share ** b
      return out + fl + 1e-6
parameters:
  d: '[0.0, 1.0]'
  q: '[0.0, 2.0]'
  lam: '[0.05, 4]'
  Mmax: '[0.3, 10]'
  fl: '[0.0, 1.0]'
  b: '[0.0, 3.0]'
  s: '[0.3, 4.0]'
  r: '[0.0, 3.0]'
  ch_dec: '[0.3, 6]'
  p: '[-0.5, 1.5]'
  rho: '[0.0, 0.9]'
rationale: The current best theory only marks pairs repeated on the immediately preceding trial, so it
  cannot distinguish the graded temporal-contiguity designs (overlap every 2 or 3 trials, 1 or 2 shared
  items). Those conditions are fit poorly. A geometrically decaying trace (rho=0 recovers the old model)
  generalises the mechanism with one parameter and applies to every condition. I also drop the dead time-decay
  parameter gd, which sat at its bound of 0, to reduce complexity for cross-validation.
