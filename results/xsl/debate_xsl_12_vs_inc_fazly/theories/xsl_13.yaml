name: Commitment-protected, consistency-scaled contiguity exclusion
theory: 'This keeps xsl_12''s account: competitive, load-dependent, interference-limited learning, a fading
  contiguity trace, and commitment-gated exclusion with redistributed credit. It changes how repetition
  and interference treat strong associations. (1) Encoding efficiency depends on whether a word''s evidence
  is consistent. A word that has not committed gets diminishing returns on exposure (negative kappa),
  so ambiguous, frequent words do not snowball. A word whose top object dominates its association (commitment)
  gets increasing returns, with exponent kpos on exposure, so repetition pays off in easy, consistent
  designs. (2) Retrieval-induced interference on absent partners is gated by commitment. The links of
  a committed word-object pair are shielded from erosion in proportion to how dominant that link is within
  the word''s association. Fillers, or other words and objects on the trial, therefore cannot erode a
  well-supported pair. (3) Exclusion still only withdraws claimed objects from other words, never from
  the committed word''s own credit. At test, objects claimed by other words are discounted by share^b,
  and choice is a power-law Luce rule.'
learn: |
  def learn(params, trials, n_words, n_objects):
      d = params['d']
      lam = params['lam']
      Mmax = params['Mmax']
      fl = params['fl']
      b = params['b']
      s = params['s']
      r = params['r']
      p = params['p']
      rho = params['rho']
      th = params['th']
      kc = params['kc']
      xi = params['xi']
      kappa = params['kappa']
      kpos = params['kpos']
      pg = params['pg']
      q = 0.07
      c = 0.5
      g = 0.5
      eps = 0.1
      steep = 8.0
      M = np.zeros((n_words, n_objects))
      prev = np.zeros((n_words, n_objects))
      cnt = np.zeros(n_words)
      for words, objs in trials:
          words = np.asarray(words)
          objs = np.asarray(objs)
          nw = len(words)
          no = len(objs)
          enc = 1.0 / (1.0 + (no / c) ** g)
          deff = min(0.95, d * (nw * no / 12.0) ** q * (no / 4.0) ** p)
          ix = np.ix_(words, objs)
          rsA = M / (M.sum(1, keepdims=True) + 0.3)
          mxA = rsA.max(1)
          zA = np.clip(steep * (mxA - th), -30.0, 30.0)
          cA = 1.0 / (1.0 + np.exp(-zA))
          PA = pg * cA[:, None] * (rsA / (mxA[:, None] + 1e-9)) ** 4
          rs = rsA[words, :]
          mx = mxA[words]
          commit = cA[words]
          rsb = rs[:, objs]
          ratio = (rsb / (mx[:, None] + 1e-9)) ** 4
          blk = M[ix].copy()
          boost = 1.0 + r * prev[ix] + kc * commit[:, None] * ratio
          contrib = commit[:, None] * rsb
          tot = contrib.sum(0, keepdims=True)
          cl = np.clip(tot - contrib, 0.0, 1.0)
          M[words, :] *= (1.0 - deff * (1.0 - PA[words, :]))
          M[:, objs] *= (1.0 - deff * (1.0 - PA[:, objs]))
          st = (blk + eps) ** s
          stw = st * (1.0 - xi * cl)
          rw = stw / (stw.sum(1, keepdims=True) + 1e-12)
          ro = st / st.sum(0, keepdims=True)
          inc = rw * ro
          sat = np.clip(1.0 - blk / Mmax, 0.0, 1.0)
          e = kappa * (1.0 - commit) + kpos * commit
          expo = ((1.0 + cnt[words]) ** e)[:, None]
          M[ix] = blk + lam * enc * expo * boost * inc * sat
          cnt[words] += 1.0
          prev *= rho
          prev[ix] = 1.0
      col = M.sum(0, keepdims=True)
      share = (M + 1e-9) / (col + 0.05)
      out = M * share ** b
      return out + fl + 1e-6
parameters:
  d: '[0.0, 1.0]'
  lam: '[0.05, 6]'
  Mmax: '[0.3, 30]'
  fl: '[0.0, 0.5]'
  b: '[0.0, 3.0]'
  s: '[0.01, 4]'
  r: '[0.0, 12.0]'
  ch_dec: '[0.3, 3]'
  p: '[-0.5, 3.0]'
  rho: '[0.0, 0.9]'
  th: '[0.2, 0.9]'
  kc: '[0, 40]'
  xi: '[0.0, 1.0]'
  kappa: '[-0.6, 1.0]'
  kpos: '[0.0, 0.6]'
  pg: '[0.0, 1.0]'
rationale: xsl_12 under-predicts easy, high-repetition conditions (filt*_9L, 215, 220, 225) because its
  negative kappa caps gain for every word and interference erodes strong links. This revision keeps the
  negative-kappa diminishing returns only for uncommitted words with conflicting evidence. Committed words
  get an exposure exponent kpos >= 0, so repetition raises accuracy where learning is easy. It also shields
  committed, dominant links from retrieval-induced interference, while leaving the object-count-dependent
  encoding and interference that capture the 221/222 contrast untouched. Setting kpos = 0 and pg = 0 recovers
  xsl_12 exactly, because the gated exponent then reduces to kappa*(1-commit). The fit can therefore only
  move away from xsl_12 if the data support it.
