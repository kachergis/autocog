name: Competition-scaled uncommitted returns with pair-count commitment gain
theory: 'The core is kept from xsl_13: competitive, load-limited learning with retrieval-induced interference,
  a fading contiguity trace, and commitment-gated exclusion with redistributed credit. What changes is
  how repetition is credited. (1) The diminishing returns for an uncommitted word are no longer a blanket
  function of its exposure count. They scale with how ambiguous that word''s association row currently
  is (1 - 1/effective number of candidate objects, from the inverse Simpson index). A word in a sparse,
  consistent design keeps near-linear returns from repetition. A word spread across many candidates, as
  in dense 4x4 designs, is still throttled and stays near floor. (2) Once a word has committed, its gain
  grows with the number of consistent co-occurrences of that specific word-object pair, (1+n_pair)^kpos.
  kpos can be large, so late repetitions keep lifting a committed pair instead of saturating with total
  word exposure.'
learn: |
  def learn(params, trials, n_words, n_objects):
      d = params['d']
      lam = params['lam']
      Mmax = params['Mmax']
      fl = params['fl']
      b = params['b']
      s = params['s']
      r = params['r']
      p = params['p']
      rho = params['rho']
      th = params['th']
      kc = params['kc']
      xi = params['xi']
      kappa = params['kappa']
      kpos = params['kpos']
      q = 0.07
      c = 0.5
      g = 0.5
      eps = 0.1
      steep = 8.0
      M = np.zeros((n_words, n_objects))
      prev = np.zeros((n_words, n_objects))
      pc = np.zeros((n_words, n_objects))
      cnt = np.zeros(n_words)
      for words, objs in trials:
          words = np.asarray(words)
          objs = np.asarray(objs)
          nw = len(words)
          no = len(objs)
          enc = 1.0 / (1.0 + (no / c) ** g)
          deff = min(0.95, d * (nw * no / 12.0) ** q * (no / 4.0) ** p)
          ix = np.ix_(words, objs)
          rsA = M / (M.sum(1, keepdims=True) + 0.3)
          mxA = rsA.max(1)
          zA = np.clip(steep * (mxA - th), -30.0, 30.0)
          cA = 1.0 / (1.0 + np.exp(-zA))
          rs = rsA[words, :]
          mx = mxA[words]
          commit = cA[words]
          rsb = rs[:, objs]
          ratio = (rsb / (mx[:, None] + 1e-9)) ** 4
          blk = M[ix].copy()
          # ambiguity of each present word's association row
          Mw = M[words, :]
          rsum = Mw.sum(1)
          rn = Mw / (rsum[:, None] + 1e-12)
          neff = 1.0 / (np.sum(rn ** 2, axis=1) + 1e-12)
          neff = np.where(rsum > 1e-6, neff, float(no))
          neff = np.maximum(neff, 1.0)
          amb = 1.0 - 1.0 / neff
          boost = 1.0 + r * prev[ix] + kc * commit[:, None] * ratio
          contrib = commit[:, None] * rsb
          tot = contrib.sum(0, keepdims=True)
          cl = np.clip(tot - contrib, 0.0, 1.0)
          M[words, :] *= (1.0 - deff)
          M[:, objs] *= (1.0 - deff)
          st = (blk + eps) ** s
          stw = st * (1.0 - xi * cl)
          rw = stw / (stw.sum(1, keepdims=True) + 1e-12)
          ro = st / st.sum(0, keepdims=True)
          inc = rw * ro
          sat = np.clip(1.0 - blk / Mmax, 0.0, 1.0)
          e_unc = kappa * amb * (1.0 - commit)
          expo_u = np.exp(np.log(1.0 + cnt[words]) * e_unc)[:, None]
          expo_c = (1.0 + pc[ix]) ** (kpos * commit[:, None])
          expo = expo_u * expo_c
          M[ix] = blk + lam * enc * expo * boost * inc * sat
          cnt[words] += 1.0
          pc[ix] += 1.0
          prev *= rho
          prev[ix] = 1.0
      col = M.sum(0, keepdims=True)
      share = (M + 1e-9) / (col + 0.05)
      out = M * share ** b
      return out + fl + 1e-6
parameters:
  d: '[0.0, 1.0]'
  lam: '[0.05, 6]'
  Mmax: '[0.3, 30]'
  fl: '[0.0, 0.5]'
  b: '[0.0, 3.0]'
  s: '[0.01, 4]'
  r: '[0.0, 12.0]'
  ch_dec: '[0.3, 3]'
  p: '[-0.5, 3.0]'
  rho: '[0.0, 0.9]'
  th: '[0.2, 0.9]'
  kc: '[0, 40]'
  xi: '[0.0, 1.0]'
  kappa: '[-1.5, 0.5]'
  kpos: '[0.0, 1.0]'
rationale: xsl_13 underpredicts the gain from 3 to 9 repetitions in the 12x12 2x2 filtering designs and
  underpredicts conditions 215 and 220. Its blanket negative exponent on total word exposure caps what
  repetition adds, and its commitment gain depends on word exposure rather than on the strength of the
  specific pair. Tying the diminishing returns to the current ambiguity of the word's row keeps the throttle
  in dense designs such as 207, where rows stay diffuse. It lifts the throttle in sparse 2x2 and 1x3 designs,
  where rows concentrate quickly. Counting consistent pair co-occurrences, with a wider kpos range, lets
  committed pairs keep gaining through late repetitions. The unused pg gate is dropped, which removes
  a parameter and reduces overfitting.
