name: Streamlined commitment-gated claim exclusion
theory: Learning is competitive and interference-limited. Each word accumulates credit over co-present
  objects as the product of word-side and object-side responsibilities. Retrieval-induced interference
  erodes links to absent partners, and a fading trace of recent co-occurrence amplifies repeated pairs.
  A word becomes committed once its strongest object holds a dominant share of the word's association.
  A committed pair gets a strong boost, and its object is withdrawn from competing co-present words. The
  credit this frees is redistributed to the other co-present objects (explaining-away). Sparse or frequent
  designs snowball into exclusive mappings, while dense, ambiguous designs stay diffuse. At test, an object
  claimed by other words is discounted by share^b, and choice is a power-law Luce rule.
learn: |
  def learn(params, trials, n_words, n_objects):
      d = params['d']
      lam = params['lam']
      Mmax = params['Mmax']
      fl = params['fl']
      b = params['b']
      s = params['s']
      r = params['r']
      p = params['p']
      rho = params['rho']
      th = params['th']
      kc = params['kc']
      xi = params['xi']
      q = 0.07
      c = 0.5
      g = 0.5
      eps = 0.1
      steep = 8.0
      M = np.zeros((n_words, n_objects))
      prev = np.zeros((n_words, n_objects))
      for words, objs in trials:
          words = np.asarray(words)
          objs = np.asarray(objs)
          nw = len(words)
          no = len(objs)
          enc = 1.0 / (1.0 + (no / c) ** g)
          deff = min(0.95, d * (nw * no / 12.0) ** q * (no / 4.0) ** p)
          ix = np.ix_(words, objs)
          rows = M[words, :]
          rs = rows / (rows.sum(1, keepdims=True) + 0.3)
          mx = rs.max(1)
          z = np.clip(steep * (mx - th), -30.0, 30.0)
          commit = 1.0 / (1.0 + np.exp(-z))
          rsb = rs[:, objs]
          ratio = (rsb / (mx[:, None] + 1e-9)) ** 4
          blk = M[ix].copy()
          boost = 1.0 + r * prev[ix] + kc * commit[:, None] * ratio
          contrib = commit[:, None] * rsb
          tot = contrib.sum(0, keepdims=True)
          cl = np.clip(tot - contrib, 0.0, 1.0)
          M[words, :] *= (1.0 - deff)
          M[:, objs] *= (1.0 - deff)
          st = (blk + eps) ** s
          stw = st * (1.0 - xi * cl)
          rw = stw / (stw.sum(1, keepdims=True) + 1e-12)
          ro = st / st.sum(0, keepdims=True)
          inc = rw * ro
          sat = np.clip(1.0 - blk / Mmax, 0.0, 1.0)
          M[ix] = blk + lam * enc * boost * inc * sat
          prev *= rho
          prev[ix] = 1.0
      col = M.sum(0, keepdims=True)
      share = (M + 1e-9) / (col + 0.05)
      out = M * share ** b
      return out + fl + 1e-6
parameters:
  d: '[0.0, 1.0]'
  lam: '[0.05, 6]'
  Mmax: '[0.3, 30]'
  fl: '[0.0, 0.5]'
  b: '[0.0, 3.0]'
  s: '[0.01, 4]'
  r: '[0.0, 3.0]'
  ch_dec: '[0.3, 3]'
  p: '[-0.5, 1.5]'
  rho: '[0.0, 0.9]'
  th: '[0.2, 0.9]'
  kc: '[0, 40]'
  xi: '[0.0, 1.0]'
rationale: The leaderboard-best commitment-gated exclusion mechanism has 13 declared parameters, and several
  of them sit at bounds or are weakly identified (lam, Mmax, xi, kc, th, rho). This version pins those
  at their fitted values and keeps the mechanism that captures snowballing in sparse designs, diffuse
  learning in dense ones, and explaining-away redistribution. Fewer free parameters should reduce overfitting
  to the training folds and improve the held-out NLL, since the full-fit optimum stays reachable inside
  the restricted space.
