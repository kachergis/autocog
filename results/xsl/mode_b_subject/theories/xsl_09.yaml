name: Commitment-gated claim exclusion with redistributed credit
theory: Learning is competitive and interference-limited. A fading trace of recent co-occurrence amplifies
  credit for repeated pairs. Each word forms a graded working hypothesis once its strongest object holds
  a dominant share of the word's association. A committed pair is strengthened further, and its object
  is withdrawn as a candidate for other co-present words. The new claim is that withdrawn credit is redistributed.
  A word that loses an object to another word's hypothesis hands that responsibility to its remaining
  co-present objects, as in genuine explaining-away, rather than just losing credit. Sparse or frequent
  designs therefore snowball into committed, exclusive mappings. Dense, ambiguous designs stay uncommitted
  and keep diffuse credit.
learn: |
  def learn(params, trials, n_words, n_objects):
      d = params['d']
      lam = params['lam']
      Mmax = params['Mmax']
      fl = params['fl']
      b = params['b']
      s = params['s']
      r = params['r']
      p = params['p']
      rho = params['rho']
      th = params['th']
      kc = params['kc']
      xi = params['xi']
      q = 0.07
      c = 0.5
      g = 0.5
      eps = 0.1
      steep = 8.0
      M = np.zeros((n_words, n_objects))
      prev = np.zeros((n_words, n_objects))
      for words, objs in trials:
          words = np.asarray(words)
          objs = np.asarray(objs)
          nw = len(words)
          no = len(objs)
          enc = 1.0 / (1.0 + (no / c) ** g)
          deff = min(0.95, d * (nw * no / 12.0) ** q * (no / 4.0) ** p)
          ix = np.ix_(words, objs)
          rows = M[words, :]
          rs = rows / (rows.sum(1, keepdims=True) + 0.3)
          mx = rs.max(1)
          z = np.clip(steep * (mx - th), -30.0, 30.0)
          commit = 1.0 / (1.0 + np.exp(-z))
          rsb = rs[:, objs]
          ratio = (rsb / (mx[:, None] + 1e-9)) ** 4
          blk = M[ix].copy()
          boost = 1.0 + r * prev[ix] + kc * commit[:, None] * ratio
          contrib = commit[:, None] * rsb
          tot = contrib.sum(0, keepdims=True)
          cl = np.clip(tot - contrib, 0.0, 1.0)
          M[words, :] *= (1.0 - deff)
          M[:, objs] *= (1.0 - deff)
          st = (blk + eps) ** s
          stw = st * (1.0 - xi * cl)
          rw = stw / (stw.sum(1, keepdims=True) + 1e-12)
          ro = st / st.sum(0, keepdims=True)
          inc = rw * ro
          sat = np.clip(1.0 - blk / Mmax, 0.0, 1.0)
          M[ix] = blk + lam * enc * boost * inc * sat
          prev *= rho
          prev[ix] = 1.0
      col = M.sum(0, keepdims=True)
      share = (M + 1e-9) / (col + 0.05)
      out = M * share ** b
      return out + fl + 1e-6
parameters:
  d: '[0.0, 1.0]'
  lam: '[0.05, 6]'
  Mmax: '[0.3, 30]'
  fl: '[0.0, 1.0]'
  b: '[0.0, 3.0]'
  s: '[0.01, 4]'
  r: '[0.0, 3.0]'
  ch_dec: '[0.3, 6]'
  p: '[-0.5, 1.5]'
  rho: '[0.0, 0.9]'
  th: '[0.2, 0.9]'
  kc: '[0, 40]'
  xi: '[0.0, 1.0]'
rationale: 'This keeps the best candidate''s structure: interference learning, a decaying contiguity trace,
  and commitment-gated claims. It changes how exclusion works. Credit withdrawn from claimed objects is
  now renormalised across the word''s other co-present objects. Previously it was simply lost, which weakened
  learning and distorted the choice of wrong objects. Redistribution should sharpen learning for sparse,
  frequent words, such as 1x3 and 3x4 9/12, where hypotheses commit and snowball. It should also keep
  dense designs diffuse, since nothing commits there. The bounds on Mmax, kc and lam are widened because
  the previous fit pinned Mmax and kc at their limits.'
