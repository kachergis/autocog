name: Uncertainty- and familiarity-biased associative learning (Kachergis, Yu & Shiffrin 2012)
theory: Learners distribute a limited amount of attention over the word-object pairs on each trial. Attention
  is drawn both to familiar pairs (already strongly associated) and to uncertain stimuli (words or objects
  whose associations are still spread over many partners, measured by entropy). The attended share of
  a fixed associative weight is added to each pair, and all associations decay slightly on every trial.
  Familiarity produces a rich-get-richer bias; uncertainty pulls attention toward stimuli that have no
  strong partner yet, which together implement a soft mutual-exclusivity bias.
learn: |
  def learn(params, trials, n_words, n_objects):
      X, B, C = params["X"], params["B"], params["C"]
      start = 0.01
      m = np.zeros((n_words, n_objects))

      def entropy(p):
          q = p[p > 0] / p.sum()
          return -(q * np.log2(q)).sum()

      for words, objects in trials:
          # seed never-seen pairs on this trial, and pairs between trial
          # stimuli and already-familiar stimuli, at a small start value
          block = m[np.ix_(words, objects)]
          block[block == 0] = start
          m[np.ix_(words, objects)] = block
          fam_o = m.sum(axis=0) > 0
          fam_w = m.sum(axis=1) > 0
          for w in words:
              m[w, fam_o & (m[w, :] == 0)] = start
          for o in objects:
              m[fam_w & (m[:, o] == 0), o] = start

          assocs = m[np.ix_(words, objects)]
          h_w = np.array([entropy(m[w, :]) for w in words])
          h_o = np.array([entropy(m[:, o]) for o in objects])
          weights = assocs * np.outer(np.exp(B * h_w), np.exp(B * h_o))
          m *= C
          m[np.ix_(words, objects)] += X * weights / weights.sum()
      return m
parameters:
  X: '[0.001, 5]'
  B: '[0.1, 15]'
  C: '[0.5, 1]'
rationale: The reference associative model; the xsl-bakeoff bounds for X, B and C.
